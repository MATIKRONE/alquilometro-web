services:
  - type: web
    name: alquilometro-web
    runtime: docker
    plan: free
    healthCheckPath: /api/
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./alquilometro.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_MINUTOS_EXPIRACION
        value: "120"
